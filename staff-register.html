<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPC Staff Registration</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="icon" href="assets/Icon Web.ico" type="image/x-icon">
    <style>
        /* Base styles */
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6A5ACD, #FFA500); /* Purple to Orange gradient */
            color: #fff;
            overflow: auto;
            background-attachment: fixed;
            background-size: cover;
        }

        /* Main container styling */
        .auth-container {
            display: flex;
            flex-direction: row;
            background: transparent;
            width: 90%;
            max-width: 1200px;
            min-height: 600px;
            margin: 40px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Left panel styles */
        .left-panel {
            width: 50%;
            background: linear-gradient(135deg, #fff, #fff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            border-right: 2px solid #6A5ACD; /* Divider */
        }

        .left-panel h2 {
            font-size: 2.3rem;
            color: #2C3E50;
            margin-bottom: 20px;
        }

        .left-panel img {
            width: 100%;
            margin-top: 20px;
        }

        .left-panel blockquote {
            font-style: italic;
            color: #5F88B8; /* Blue quote color */
            margin-top: 20px;
        }

        /* Right panel (form) styles */
        .right-panel {
            width: 50%;
            background: #FFFFFF;
            padding: 20px; /* Adjusted padding */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch; /* Allow items to stretch */
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .right-panel h2 {
            font-size: 2rem;
            font-weight: bold;
            color: #2C3E50;
            margin-bottom: 15px; /* Adjusted margin */
        }

        .right-panel .mb-3 {
            margin-bottom: 10px; /* Reduced margin */
        }

        .form-control {
            border: 2px solid #6A5ACD; /* Purple border */
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 1rem;
            margin-bottom: 10px; /* Adjusted margin */
            color: #2C3E50;
            transition: all 0.3s ease-in-out;
        }

        .form-control:focus {
            border-color: #FFA500; /* Orange focus border */
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.5); /* Orange shadow */
        }

        .btn-primary {
            background: #6A5ACD; /* Purple button */
            border: none;
            border-radius: 30px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #FFFFFF;
            transition: all 0.3s ease-in-out;
        }

        .btn-primary:hover {
            background: #5F4C8A; /* Darker purple on hover */
        }

        .btn-secondary {
            background: #FFA500; /* Orange button */
            border: none;
            border-radius: 30px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #FFFFFF;
            margin-top: 15px;
            transition: all 0.3s ease-in-out;
        }

        .btn-secondary:hover {
            background: #FF8C00; /* Darker orange on hover */
        }

        a {
            color: #6A5ACD; /* Purple link */
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        a:hover {
            color: #FFA500; /* Orange on hover */
        }

        p {
            color: #4D5E6F;
        }

        /* Animation */
        .auth-container {
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column; /* Stack panels on smaller screens */
                height: auto; /* Allow height to adjust */
            }

            .left-panel, .right-panel {
                width: 100%; /* Full width on small screens */
                border-right: none; /* Remove divider */
            }

            .right-panel {
                padding: 15px; /* Adjust padding for smaller screens */
            }

            .form-label{
                color: black;
            }
        }
            .form-label{
                color: black;
            }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <h2>Join Us Now!</h2>
            <img src="assets/stafforganization.gif" alt="Staff Register Illustration">
            <blockquote>"Together we achieve more"</blockquote> <!-- Motivational quote -->
        </div>

        <!-- Right Panel (Form) -->
        <div class="right-panel">
            <h2>Staff Registration</h2>
            <form action="staff-register.php" method="POST" class="w-100">
                <!-- Full Name Field -->
                <div class="mb-3 w-100">
                    <label for="staff-name" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="staff-name" 
                        name="name" 
                        placeholder="Enter your full name" 
                        required>
                </div>
                <!-- Staff ID Field -->
                <div class="mb-3 w-100">
                    <label for="staffId" class="form-label">Staff ID</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="staffId" 
                        name="staffId" 
                        placeholder="Enter your staff ID" 
                        required
                        maxlength="4">
                </div>
                <!-- Password Field -->
                <div class="mb-3 w-100">
                    <label for="staff-password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="staff-password" 
                        name="password" 
                        placeholder="Create a password" 
                        required 
                        minlength="8" 
                        maxlength="12"> 
                </div>
                <!-- Confirm Password Field -->
                <div class="mb-3 w-100">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="confirm-password" 
                        name="confirmPassword" 
                        placeholder="Confirm your password" 
                        required 
                        minlength="8" 
                        maxlength="12"> 
                </div>
                <!-- Register Button -->
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <hr>
            <p class="text-center mt-3">
                Already have an account? 
                <a href="staff-login.html">Login</a>
            </p>
            <div class="text-center mt-3">
                <a href="landingpage.html" class="btn btn-secondary w-100">Back to Landing Page</a>
            </div>
        </div>
    </div>

    <!-- Local Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        function redirectToStaffLogin(event) {
            event.preventDefault(); // Prevent the default form submission
            window.location.href = 'staff-login.html'; // Redirect to the login page
        }
    </script>
</body>
</html>
